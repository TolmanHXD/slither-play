<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slither</title>
<style>
  :root { --bg:#100c09; --card:#1a1410; --line:#3a2a22; --ink:#fff4ec; --muted:#c9b2a4; --orange:#ff7a1a; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; color:var(--ink); background:radial-gradient(900px 480px at 0% 0%, #3a1d0c, transparent 55%), var(--bg); font-family:"Segoe UI", Arial, sans-serif; }
  main { max-width:1200px; margin:0 auto; padding:28px 18px 50px; }
  h1 { margin:0; font-size:40px; font-weight:700; letter-spacing:-0.03em; }
  h1 span { color:var(--orange); }
  p { color:var(--muted); margin:8px 0 0; }
  .top { display:flex; justify-content:space-between; align-items:flex-end; gap:16px; }
  .pill { border:1px solid var(--line); border-radius:999px; padding:8px 12px; background:#1c1511; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#6d5b50; margin-right:8px; }
  .on .dot { background:var(--orange); }
  .stats, .cols { display:grid; gap:12px; }
  .stats { grid-template-columns:repeat(4, 1fr); margin:22px 0; }
  .cols { grid-template-columns:320px 1fr; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; }
  .stat b { display:block; font-size:28px; }
  .stat span, label { color:var(--muted); font-size:13px; }
  label { display:block; margin:12px 0 6px; }
  input { width:100%; background:#120e0c; color:white; border:1px solid var(--line); border-radius:10px; padding:11px 12px; font:inherit; }
  .actions { display:flex; gap:8px; margin-top:14px; }
  button { border:0; border-radius:10px; padding:11px 12px; font:inherit; cursor:pointer; }
  .go { flex:1; background:var(--orange); color:#1a0d06; font-weight:700; }
  .ghost, .mini { background:transparent; color:var(--ink); border:1px solid var(--line); }
  .mini { padding:6px 8px; }
  .msg { min-height:20px; color:#ffc49a; margin-top:8px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { text-align:left; color:var(--muted); font-weight:500; padding:8px 6px; }
  td { padding:8px 6px; border-top:1px solid #2b211c; }
  .scroll { max-height:520px; overflow:auto; }
  h2 { margin:0 0 10px; font-size:18px; }
  .mask { position:fixed; inset:0; background:rgba(0,0,0,.72); display:none; align-items:center; justify-content:center; padding:18px; }
  .mask.show { display:flex; }
  .window { width:min(1100px, 100%); background:#14110f; border:1px solid #5a3518; border-radius:18px; overflow:hidden; }
  .bar { display:flex; justify-content:space-between; align-items:center; padding:10px 12px; }
  canvas { width:100%; height:min(70vh, 680px); background:#000; display:block; cursor:crosshair; }
  .proxybox { width:min(480px, 100%); }
  .proxybox p { margin:6px 0; }
  @media (max-width:900px) { .stats, .cols { grid-template-columns:1fr 1fr; } .cols { grid-template-columns:1fr; } }
</style>
</head>
<body>
<main>
  <div class="top">
    <div>
      <h1>Slither <span>desk</span></h1>
      <p>Envoie les bots, suis chaque joueur, ouvre son proxy ou prends le contrôle.</p>
    </div>
    <div class="pill" id="pill"><span class="dot"></span><span id="pillText">hors ligne</span></div>
  </div>
  <section class="stats" id="stats"></section>
  <section class="cols">
    <form class="card" id="form">
      <label>Pseudo</label>
      <input name="name" maxlength="23" value="free israel">
      <label>Count</label>
      <input name="count" type="number" min="1" value="30">
      <label>Serveur</label>
      <input name="server" type="number" value="5724">
      <label>Skin</label>
      <input name="skin" type="number" min="0" max="64" value="61">
      <div class="actions">
        <button class="go" type="submit">Envoyer</button>
        <button class="ghost" id="stop" type="button">Stop</button>
      </div>
      <div class="msg" id="msg"></div>
    </form>
    <div class="card">
      <h2>Joueurs</h2>
      <div class="scroll"><table>
        <thead><tr><th>#</th><th>Pseudo</th><th>Position</th><th>Mort</th><th>Taille</th><th>Proxy</th><th></th></tr></thead>
        <tbody id="players"></tbody>
      </table></div>
    </div>
  </section>
  <section class="card" style="margin-top:12px">
    <h2>Proxys</h2>
    <div class="scroll"><table>
      <thead><tr><th>IP</th><th>OK</th><th>Rejet</th><th>En jeu</th><th>État</th><th></th></tr></thead>
      <tbody id="proxies"></tbody>
    </table></div>
  </section>
</main>
<div class="mask" id="play">
  <div class="window">
    <div class="bar"><strong id="playTitle">Contrôle</strong><button class="ghost" id="closePlay" type="button">Fermer</button></div>
    <canvas id="game" width="1100" height="680"></canvas>
  </div>
</div>
<div class="mask" id="proxy">
  <div class="window proxybox">
    <div class="bar"><strong>Proxy</strong><button class="ghost" id="closeProxy" type="button">Fermer</button></div>
    <div id="proxyBody" style="padding:0 14px 16px"></div>
  </div>
</div>
<script src="/s/look.js"></script>
<script>
const keys = [["count","Count"],["alive","En jeu"],["connecting","Connexion"],["dead","Morts"],["deaths","Morts total"],["proxyTotal","Proxys"],["proxyOk","Proxys ok"],["proxyBad","Proxys rejetés"]];
let players = [];
let slot = null;
let boosting = false;
let lastSend = 0;
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function paint(data) {
  document.getElementById("stats").innerHTML = keys.map(([k,n]) => `<article class="card stat"><b>${data[k] ?? 0}</b><span>${n}</span></article>`).join("");
  document.getElementById("pill").classList.toggle("on", !!data.running);
  document.getElementById("pillText").textContent = data.running ? `en ligne · ${data.server || "-"}` : "hors ligne";
  players = data.players || [];
  document.getElementById("players").innerHTML = players.map(p => `<tr>
    <td>${p.slot + 1}</td><td>${p.name}</td><td>${p.x} , ${p.y}</td><td>${p.dead ? "oui" : "non"}</td><td>${p.size}</td>
    <td><button class="mini" data-proxy="${p.slot}">${p.proxyState}</button></td>
    <td><button class="mini" data-play="${p.slot}">Contrôler</button></td></tr>`).join("") || `<tr><td colspan="7">Aucun joueur.</td></tr>`;
  document.getElementById("proxies").innerHTML = (data.rows || []).map(r => `<tr>
    <td>${r.host}</td><td>${r.ok}</td><td>${r.fail}</td><td>${r.live}</td><td>${r.state}</td>
    <td><button class="mini" data-host="${r.host}">Détails</button></td></tr>`).join("") || `<tr><td colspan="6">Aucun proxy utilisé.</td></tr>`;
}
async function refresh() {
  paint(await (await fetch("/api/status")).json());
}
document.body.addEventListener("click", (event) => {
  const play = event.target.dataset.play;
  const proxy = event.target.dataset.proxy;
  const host = event.target.dataset.host;
  if (play != null) openPlay(Number(play));
  if (proxy != null) openProxy(players.find(p => p.slot === Number(proxy)));
  if (host != null) {
    const row = players.find(p => p.proxyHost === host) || {};
    openProxy({ ...row, proxyHost: host });
  }
});
function openProxy(p) {
  if (!p) return;
  document.getElementById("proxyBody").innerHTML = `<p>IP : ${p.proxyHost || ""}</p><p>Port : ${p.proxyPort || ""}</p><p>Utilisateur : ${p.proxyUser || ""}</p><p>Mot de passe : ${p.proxyPass || ""}</p><p>OK : ${p.proxyOk || 0}</p><p>Rejet : ${p.proxyFail || 0}</p><p>État : ${p.proxyState || ""}</p>`;
  document.getElementById("proxy").classList.add("show");
}
document.getElementById("closeProxy").onclick = () => document.getElementById("proxy").classList.remove("show");
let lookAssets = null;
let bgPattern = null;
const bgImg = new Image();
const gbgImg = new Image();
bgImg.onload = () => { bgPattern = ctx.createPattern(bgImg, "repeat"); };
bgImg.src = "/s/bg54.jpg";
gbgImg.src = "/s/gbg.jpg";
let camX = 0, camY = 0, camReady = false, glowClock = 0;

function ensureLook() {
  if (!lookAssets && window.SLITHER_LOOK) lookAssets = SLITHER_LOOK.build();
  return lookAssets;
}
function zoomFor(count) {
  return 0.64285 + 0.514285714 / Math.max(1, ((count || 2) + 16) / 36);
}
function place(x, y, hx, hy, gsc) {
  return [canvas.width / 2 + (x - hx) * gsc, canvas.height / 2 + (y - hy) * gsc];
}
function skinList(cv) {
  const table = window.SLITHER_LOOK && SLITHER_LOOK.rbcs;
  const row = table && table[cv];
  if (row && row.length) return row;
  const n = (window.SLITHER_LOOK && SLITHER_LOOK.rrs.length) || 42;
  return [((cv % n) + n) % n];
}
function scaleFrame(pack, fromHead) {
  const total = pack.kmcs.length;
  if (!pack.klp) return fromHead % total;
  const span = total * 2;
  let k = fromHead % span;
  if (k >= total) k = span - (k + 1);
  return k;
}
function resample(points, step) {
  if (!points || !points.length) return [];
  if (points.length === 1 || step <= 0) return points.map(p => [p[0], p[1]]);
  const out = [[points[0][0], points[0][1]]];
  let prev = points[0];
  let acc = 0;
  for (let i = 1; i < points.length; i++) {
    let cur = points[i];
    let dx = cur[0] - prev[0], dy = cur[1] - prev[1];
    let dist = Math.hypot(dx, dy);
    if (dist < 1e-4) continue;
    while (acc + dist >= step) {
      const t = (step - acc) / dist;
      const x = prev[0] + dx * t, y = prev[1] + dy * t;
      out.push([x, y]);
      dx = cur[0] - x; dy = cur[1] - y; dist = Math.hypot(dx, dy); prev = [x, y]; acc = 0;
      if (out.length > 900) return out;
    }
    acc += dist;
    prev = cur;
  }
  const last = points[points.length - 1];
  const end = out[out.length - 1];
  if (Math.hypot(end[0] - last[0], end[1] - last[1]) > 0.5) out.push([last[0], last[1]]);
  return out;
}
function facingOf(points) {
  if (!points || points.length < 2) return 0;
  const head = points[points.length - 1], neck = points[points.length - 2];
  return Math.atan2(head[1] - neck[1], head[0] - neck[0]);
}
function drawBackdrop(hx, hy, gsc) {
  const w = canvas.width, h = canvas.height;
  ctx.globalCompositeOperation = "source-over";
  ctx.globalAlpha = 1;
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, w, h);
  if (gbgImg.complete && gbgImg.naturalWidth) {
    ctx.globalAlpha = 0.3;
    ctx.drawImage(gbgImg, 0, 0, w, h);
    ctx.globalAlpha = 1;
  }
  if (!bgPattern) return;
  ctx.save();
  ctx.translate(w / 2, h / 2);
  ctx.scale(gsc, gsc);
  ctx.translate(-hx, -hy);
  ctx.fillStyle = bgPattern;
  ctx.fillRect(hx - w / gsc, hy - h / gsc, (w * 2) / gsc, (h * 2) / gsc);
  ctx.restore();
}
function blit(img, x, y, radius) {
  ctx.drawImage(img, x - radius, y - radius, radius * 2, radius * 2);
}
function drawFoodOrb(x, y, rad, cv, hx, hy, gsc, glowOnly) {
  const pack = lookAssets.colors[cv > 9 ? cv % 9 : cv];
  if (!pack || !pack.imgs.length) return;
  const idx = Math.max(0, Math.min(pack.imgs.length - 1, Math.floor(pack.ic * gsc * rad / 16.5)));
  const spot = place(x, y, hx, hy, gsc);
  if (!glowOnly) {
    const shadow = pack.oimgs[idx];
    ctx.globalAlpha = 0.8;
    ctx.drawImage(shadow, spot[0] - shadow.width / 2, spot[1] - shadow.height / 2);
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    const orb = pack.imgs[idx];
    const pulse = 0.5 + 0.5 * Math.cos(glowClock / 13);
    ctx.globalAlpha = 1;
    ctx.drawImage(orb, spot[0] - orb.width / 2, spot[1] - orb.height / 2);
    ctx.globalAlpha = pulse;
    ctx.drawImage(orb, spot[0] - orb.width / 2, spot[1] - orb.height / 2);
    ctx.restore();
    return;
  }
  const dx = x - hx, dy = y - hy, dist2 = dx * dx + dy * dy;
  const near = Math.max(0, Math.min(pack.gimgs.length - 1, Math.floor(pack.ic * gsc * (0.25 + 0.75 * rad / 16.5))));
  const far = Math.max(0, Math.min(pack.gimgs.length - 1, Math.floor(pack.ic * gsc * 2 * (0.25 + 0.75 * rad / 16.5))));
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  const pulse = 0.5 + 0.5 * Math.cos(glowClock / 13);
  [[1.06, near, 0.005 + 0.09 * (1 - dist2 / (86000 + dist2))], [1.32, far, 0.085 * (1 - dist2 / (16500 + dist2))]].forEach(([spread, which, alpha]) => {
    const glow = pack.gimgs[which];
    const gx = canvas.width / 2 + dx * spread * gsc;
    const gy = canvas.height / 2 + dy * spread * gsc;
    ctx.globalAlpha = alpha;
    ctx.drawImage(glow, gx - glow.width / 2, gy - glow.height / 2);
    ctx.globalAlpha = alpha * pulse;
    ctx.drawImage(glow, gx - glow.width / 2, gy - glow.height / 2);
  });
  ctx.restore();
}
function drawPrey(x, y, rad, cv, hx, hy, gsc) {
  const pack = lookAssets.colors[Math.abs(cv) % 9];
  if (!pack || !pack.pr_imgs.length) return;
  const idx = Math.max(0, Math.min(pack.pr_imgs.length - 1, Math.floor(pack.pr_imgs.length * gsc * rad / 9)));
  const img = pack.pr_imgs[idx];
  const spot = place(x, y, hx, hy, gsc);
  ctx.globalAlpha = 0.9;
  ctx.drawImage(img, spot[0] - img.width / 2, spot[1] - img.height / 2);
  const glow = pack.gimgs[pack.gimgs.length - 1];
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.globalAlpha = 0.35;
  ctx.drawImage(glow, spot[0] - glow.width, spot[1] - glow.height, glow.width * 2, glow.height * 2);
  ctx.restore();
}
function drawSnake(points, cv, boost, hx, hy, gsc) {
  if (!points || points.length < 1) return;
  const sc = Math.min(6, 1 + Math.max(0, points.length - 2) / 106);
  const radius = 29 * sc * 0.5;
  const body = resample(points, Math.max(4.5, radius * 0.42));
  const colors = skinList(cv || 0);
  const ang = facingOf(body);
  ctx.save();
  for (let index = 0; index < body.length; index++) {
    const fromHead = body.length - 1 - index;
    const spot = place(body[index][0], body[index][1], hx, hy, gsc);
    ctx.globalAlpha = 1;
    blit(lookAssets.komc, spot[0], spot[1], gsc * radius * 52 / 32);
    ctx.globalAlpha = fromHead < 9 ? fromHead / 9 : 1;
    blit(lookAssets.ksmc, spot[0], spot[1], gsc * radius * 62 / 32);
  }
  if (boost) {
    ctx.globalCompositeOperation = "lighter";
    for (let index = body.length - 1; index >= 0; index--) {
      const fromHead = body.length - 1 - index;
      const spot = place(body[index][0], body[index][1], hx, hy, gsc);
      const pack = lookAssets.colors[colors[fromHead % colors.length] % lookAssets.colors.length];
      const pulse = 0.6 + 0.4 * Math.cos(fromHead / 4 - 1.15 * glowClock);
      ctx.globalAlpha = 0.38 * pulse;
      blit(pack.kfmc, spot[0], spot[1], 1.5 * gsc * radius * (1 + (62 / 32 - 1)));
    }
    ctx.globalCompositeOperation = "source-over";
  }
  for (let index = 0; index < body.length; index++) {
    const fromHead = body.length - 1 - index;
    const prev = body[Math.max(0, index - 1)];
    const angSeg = Math.atan2(body[index][1] - prev[1], body[index][0] - prev[0]);
    const pack = lookAssets.colors[colors[fromHead % colors.length] % lookAssets.colors.length];
    const frame = pack.kmcs[scaleFrame(pack, fromHead)];
    const swell = fromHead < 4 ? radius * (1 + (4 - fromHead) * (cv === 27 ? 0.06 : 0)) : radius;
    const spot = place(body[index][0], body[index][1], hx, hy, gsc);
    ctx.save();
    ctx.globalAlpha = 1;
    ctx.translate(spot[0], spot[1]);
    ctx.rotate(angSeg);
    ctx.drawImage(frame, -gsc * swell, -gsc * swell, gsc * 2 * swell, gsc * 2 * swell);
    ctx.restore();
  }
  if (boost) {
    ctx.globalCompositeOperation = "lighter";
    for (let index = body.length - 1; index >= 0; index--) {
      const fromHead = body.length - 1 - index;
      const spot = place(body[index][0], body[index][1], hx, hy, gsc);
      const pack = lookAssets.colors[colors[fromHead % colors.length] % lookAssets.colors.length];
      const pulse = 0.5 + 0.5 * Math.cos(fromHead / 4 - glowClock);
      ctx.globalAlpha = 0.37 * pulse;
      blit(pack.kfmc, spot[0], spot[1], gsc * radius * 2);
    }
  }
  ctx.restore();
  const head = body[body.length - 1];
  const headSpot = place(head[0], head[1], hx, hy, gsc);
  const ed = 6 * sc, esp = 6 * sc;
  for (const side of [-1, 1]) {
    const ox = Math.cos(ang + side * Math.PI / 2);
    const oy = Math.sin(ang + side * Math.PI / 2);
    ctx.globalAlpha = 0.75;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(headSpot[0] + (Math.cos(ang) * ed + ox * (esp + 0.5)) * gsc, headSpot[1] + (Math.sin(ang) * ed + oy * (esp + 0.5)) * gsc, 6 * sc * gsc, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = "#000000";
    ctx.beginPath();
    ctx.arc(headSpot[0] + (Math.cos(ang) * (ed + 0.5) + ox * esp) * gsc, headSpot[1] + (Math.sin(ang) * (ed + 0.5) + oy * esp) * gsc, 3.5 * sc * gsc, 0, Math.PI * 2);
    ctx.fill();
  }
  return { head, sc, spot: headSpot };
}
function drawName(nick, spot, sc, gsc) {
  if (!nick) return;
  ctx.globalAlpha = 0.55;
  ctx.font = "15px Arial, 'Helvetica Neue', Helvetica, sans-serif";
  ctx.fillStyle = "#ffffff";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(nick, spot[0], spot[1] + 32 + 11 * sc * gsc);
}
function drawBorder(hx, hy, gsc, grd) {
  if (!grd) return;
  const flux = grd * 0.98;
  const ang = Math.atan2(hy - grd, hx - grd);
  if (Math.abs(flux - Math.hypot(hx - grd, hy - grd)) > 4000) return;
  ctx.save();
  ctx.globalAlpha = 0.8;
  ctx.lineWidth = 23 * gsc;
  ctx.strokeStyle = "#800000";
  ctx.beginPath();
  for (let step = -2000; step <= 2000; step += 80) {
    const spot = place(grd + Math.cos(ang + step / flux) * flux, grd + Math.sin(ang + step / flux) * flux, hx, hy, gsc);
    if (step === -2000) ctx.moveTo(spot[0], spot[1]); else ctx.lineTo(spot[0], spot[1]);
  }
  ctx.stroke();
  ctx.restore();
}
async function frame() {
  if (slot == null) return;
  const view = await (await fetch("/api/view?slot=" + slot)).json();
  const targetX = view.x || 0, targetY = view.y || 0;
  if (!camReady) { camX = targetX; camY = targetY; camReady = true; }
  else { camX += (targetX - camX) * 0.45; camY += (targetY - camY) * 0.45; }
  const hx = camX, hy = camY;
  const count = (view.me && view.me.length) || view.size || 2;
  const gsc = zoomFor(count);
  glowClock += view.fast || boosting ? 0.55 : 0.08;
  if (!ensureLook()) {
    ctx.fillStyle = "#000"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    return;
  }
  drawBackdrop(hx, hy, gsc);
  (view.foods || []).forEach(food => drawFoodOrb(food[0], food[1], food[2] || 2, food[3] || 0, hx, hy, gsc, false));
  (view.preys || []).forEach(prey => drawPrey(prey[0], prey[1], prey[2] || 4, prey[3] || 0, hx, hy, gsc));
  (view.others || []).forEach(snake => {
    const drawn = drawSnake(snake.pts, snake.cv || 0, !!snake.fast, hx, hy, gsc);
    if (drawn) drawName(snake.nick, drawn.spot, drawn.sc, gsc);
  });
  const mine = drawSnake(view.me, view.cv || 0, !!(boosting || view.fast), hx, hy, gsc);
  if (mine) drawName(view.name, mine.spot, mine.sc, gsc);
  (view.foods || []).forEach(food => drawFoodOrb(food[0], food[1], food[2] || 2, food[3] || 0, hx, hy, gsc, true));
  drawBorder(hx, hy, gsc, view.grd || 0);
  ctx.globalAlpha = 1;
  document.getElementById("playTitle").textContent = `${view.name || ""} · taille ${view.size || 0} · ${view.alive ? "vivant" : "mort"}`;
}
function openPlay(next) {
  slot = next; boosting = false; camReady = false;
  document.getElementById("play").classList.add("show");
  if (!openPlay.timer) openPlay.timer = setInterval(frame, 45);
  frame();
}
async function steer(event) {
  if (slot == null) return;
  const now = performance.now();
  if (now - lastSend < 30 && event.type === "mousemove") return;
  lastSend = now;
  const rect = canvas.getBoundingClientRect();
  const dx = (event.clientX - rect.left) * (canvas.width / rect.width) - canvas.width / 2;
  const dy = (event.clientY - rect.top) * (canvas.height / rect.height) - canvas.height / 2;
  await fetch("/api/control", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ slot, angle: Math.atan2(dy, dx), boost: boosting, on: true }) });
}
canvas.onmousemove = steer;
canvas.onmousedown = (e) => { boosting = true; steer(e); };
canvas.onmouseup = (e) => { boosting = false; steer(e); };
canvas.onmouseleave = () => { boosting = false; };
document.getElementById("closePlay").onclick = async () => {
  document.getElementById("play").classList.remove("show");
  if (slot != null) await fetch("/api/control", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ slot, on: false }) });
  slot = null;
};
document.getElementById("form").onsubmit = async (e) => {
  e.preventDefault();
  const body = Object.fromEntries(new FormData(e.target));
  body.name = String(body.name || "").slice(0, 23);
  const data = await (await fetch("/api/start", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(body) })).json();
  document.getElementById("msg").textContent = data.message || "";
  refresh();
};
